[package]
name = "kingfisherd"
version = "0.1.0"
edition = "2021"
description = "Resident Kingfisher secret scanner for AgentGuard — compiles rules once, serves fast scans over a Unix socket"

[[bin]]
name = "kingfisherd"
path = "src/main.rs"

[dependencies]
# Kingfisher library crates are internal/beta and not published to crates.io, so
# we pin to a release tag for a reproducible build (see docs/LIBRARY.md).
kingfisher-core = { git = "https://github.com/mongodb/kingfisher", tag = "v1.103.0" }
kingfisher-rules = { git = "https://github.com/mongodb/kingfisher", tag = "v1.103.0" }
kingfisher-scanner = { git = "https://github.com/mongodb/kingfisher", tag = "v1.103.0" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
